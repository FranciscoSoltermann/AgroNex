name: AgroNex CI/CD Pipeline

on:
  push:
    branches: [ "main", "desarrollo", "feature-desarrollo" ]
  pull_request:
    branches: [ "main", "desarrollo" ]

jobs:
  backend-ci:
    name: Backend CI (Spring Boot & JaCoCo)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agronex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Tests with JaCoCo Coverage
        working-directory: ./backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/agronex_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgrespassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SUPABASE_ISSUER_URI: https://mock-supabase.supabase.co/auth/v1
        run: ./mvnw clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: ./backend/target/site/jacoco/

  frontend-ci:
    name: Frontend CI (Next.js & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Lint
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build Next.js app
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
        run: npm run build

  docker-build:
    name: Validate Docker Containers
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Build
        run: docker compose build --no-cache
