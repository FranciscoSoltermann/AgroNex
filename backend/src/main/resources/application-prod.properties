# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE PRODUCCIÓN (SPRING BOOT)
# Activa esto con: SPRING_PROFILES_ACTIVE=prod
# -----------------------------------------------------------------------------

# Puerto por defecto (Render asigna la variable PORT dinámicamente)
server.port=${PORT:8080}

# Base de datos (inyectada por entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - En producción NUNCA usar update o create-drop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optimización del Pool de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Logging para producción (sólo WARN y ERROR para librerías, INFO para AgroNex)
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
logging.level.org.agronex=INFO

# Seguridad CORS (Vercel)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
