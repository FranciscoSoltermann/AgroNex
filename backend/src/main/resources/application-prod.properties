# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE PRODUCCIÓN (SPRING BOOT) — Optimizada para Render Free Tier
# Activa esto con: SPRING_PROFILES_ACTIVE=prod
# Límites del plan Free de Render: 0.1 CPU / 512 MB RAM
# -----------------------------------------------------------------------------

# Puerto dinámico que asigna Render
server.port=${PORT:8080}

# ─── Base de datos (Mismas variables que application.properties para evitar errores) ───
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones minimalista para 512 MB
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Tomcat embebido ─────────────────────────────────────────────────────────
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=50
server.tomcat.max-connections=100

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
logging.level.org.agronex=INFO
spring.output.ansi.enabled=NEVER

# ─── Seguridad CORS (Con fallback seguro si no se define) ────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://agronex.vercel.app}

# ─── Swagger desactivado en producción ───────────────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
