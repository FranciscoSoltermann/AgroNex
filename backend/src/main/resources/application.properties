spring.application.name=agronex

# ─── Base de Datos ───────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# SEGURIDAD e INGENIERÍA: Las migraciones de base de datos ahora se manejan estrictamente
# vía Supabase CLI (ver /supabase/migrations). Nunca usar ddl-auto=update.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
# SEGURIDAD: desactivado en producción para no exponer datos sensibles en logs
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false



# ─── Seguridad JWT ────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:https://qgokssagrwpsfryhczug.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_SET_URI:https://qgokssagrwpsfryhczug.supabase.co/auth/v1/.well-known/jwks.json}

# ─── CORS (separar múltiples orígenes con coma) ───────────────
# Ejemplo producción: CORS_ALLOWED_ORIGINS=https://agronex.com,https://www.agronex.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ─── Swagger / OpenAPI ───────────────────────────────────────
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:${SWAGGER_ENABLED:true}}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Manejo Global de Errores RFC 7807 ────────────────────────
spring.mvc.problemdetails.enabled=true

# ─── Monitoreo & Actuador (Prometheus & Health) ────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=agronex-backend

# ─── APIs externas ───────────────────────────────────────────
api.agromonitoring.key=${AGROMONITORING_API_KEY:}

# ─── John Deere ──────────────────────────────────────────────
spring.security.oauth2.client.registration.johndeere.client-id=${JOHN_DEERE_CLIENT_ID}
spring.security.oauth2.client.registration.johndeere.client-secret=${JOHN_DEERE_CLIENT_SECRET}
spring.security.oauth2.client.registration.johndeere.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.johndeere.scope=openid, profile, offline_access, ag1, ag2, ag3, eq1, eq2, org1, org2, files
spring.security.oauth2.client.registration.johndeere.redirect-uri={baseUrl}/api/maquinaria/john-deere/auth/callback
spring.security.oauth2.client.provider.johndeere.authorization-uri=https://signin.johndeere.com/oauth2/aus78tnlaysMraFhC1t7/v1/authorize
spring.security.oauth2.client.provider.johndeere.token-uri=https://signin.johndeere.com/oauth2/aus78tnlaysMraFhC1t7/v1/token
spring.security.oauth2.client.provider.johndeere.jwk-set-uri=https://signin.johndeere.com/oauth2/aus78tnlaysMraFhC1t7/v1/keys
spring.security.oauth2.client.provider.johndeere.user-name-attribute=sub

# Propiedades originales usadas por JohnDeereConfig
john-deere.client-id=${JOHN_DEERE_CLIENT_ID:}
john-deere.client-secret=${JOHN_DEERE_CLIENT_SECRET:}
john-deere.api-base-url=${JOHN_DEERE_API_BASE_URL:https://sandboxapi.deere.com/platform}

# ─── Mail (Gmail SMTP) ───────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:soporte.agronex@gmail.com}
spring.mail.password=${MAIL_PASSWORD:meqpsypcasmjyozw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from-email=${MAIL_FROM_EMAIL:AgroNex <soporte.agronex@gmail.com>}

# ─── Mercado Pago ────────────────────────────────────────────
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.success-url=${MERCADOPAGO_SUCCESS_URL:http://localhost:3000/subscriptions?mp_status=approved}
mercadopago.pending-url=${MERCADOPAGO_PENDING_URL:http://localhost:3000/subscriptions?mp_status=pending}
mercadopago.failure-url=${MERCADOPAGO_FAILURE_URL:http://localhost:3000/subscriptions?mp_status=failure}
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}
mercadopago.currency-id=${MERCADOPAGO_CURRENCY_ID:ARS}
mercadopago.test-payer-email=${MERCADOPAGO_TEST_PAYER_EMAIL:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.webhook-signature-required=${MERCADOPAGO_WEBHOOK_SIGNATURE_REQUIRED:true}
mercadopago.webhook-replay-window-seconds=${MERCADOPAGO_WEBHOOK_REPLAY_WINDOW_SECONDS:300}

# Rate limit checkout público Mercado Pago (req/min por IP)
public.mercadopago.checkout.rate-limit-per-minute=${MP_CHECKOUT_RATE_LIMIT_PER_MINUTE:15}

# Rate limit validación de disponibilidad de registro (req/min por IP)
public.auth.registro.rate-limit-per-minute=${AUTH_REGISTRO_RATE_LIMIT_PER_MINUTE:20}

# ─── Cifrado de campos sensibles (VUL-A03) ───────────────────────────────────
# Clave AES-256 de 32 caracteres exactos para cifrar tokens de John Deere en BD.
# OBLIGATORIO en producción. Generar con: openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32
# Si no se configura, se usará una clave de desarrollo (NO SEGURA — ver AesFieldEncryptor).
encryption.secret-key=${ENCRYPTION_SECRET_KEY:}

# ─── Proxies confiables para Rate Limiting (VUL-A01) ────────────────────────
# IPs del load balancer/nginx separadas por coma.
# Solo desde estas IPs se aceptará X-Forwarded-For para identificar la IP real del cliente.
# Ejemplo producción: TRUSTED_PROXY_IPS=10.0.0.1,10.0.0.2
trusted.proxy.ips=${TRUSTED_PROXY_IPS:}

# ─── John Deere OAuth Redirects ──────────────────────────────────────────────
john-deere.redirect-uri=${JOHN_DEERE_REDIRECT_URI:http://localhost:8080/api/maquinaria/john-deere/auth/callback}
john-deere.frontend-redirect=${JOHN_DEERE_FRONTEND_REDIRECT:http://localhost:3000/dashboard/maquinaria}

# Actuator & Prometheus
management.prometheus.metrics.export.enabled=true

# ─── Caché Distribuida (Redis) ────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# ─── Resilience4j (Circuit Breaker) ──────────────────────────────────────────
resilience4j.circuitbreaker.instances.externalApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.externalApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.externalApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.externalApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.externalApi.failureRateThreshold=50

resilience4j.retry.instances.externalApi.maxAttempts=3
resilience4j.retry.instances.externalApi.waitDuration=500ms
resilience4j.retry.instances.externalApi.retryExceptions=org.springframework.web.client.RestClientException,java.io.IOException
