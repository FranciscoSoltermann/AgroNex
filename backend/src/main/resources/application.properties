spring.application.name=agronex-backend

# --- CONFIGURACIÓN DE BASE DE DATOS (.env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Esto ayuda a mantener la conexión viva con el pooler de Supabase
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hace que el SQL en la consola sea fácil de leer (no todo en una línea)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SEGURIDAD
supabase.jwt.secret=${SUPABASE_JWT_SECRET}