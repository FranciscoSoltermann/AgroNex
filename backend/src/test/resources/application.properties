spring.application.name=agronex

# Database configuration pointing to the test database (Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agronex_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=false
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=8
#spring.flyway.validate-on-migrate=false

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:https://example.supabase.co/auth/v1}

cors.allowed-origins=http://localhost:3000,http://localhost:3001

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

api.agromonitoring.key=

# John Deere
spring.security.oauth2.client.registration.johndeere.client-id=dummy
spring.security.oauth2.client.registration.johndeere.client-secret=dummy
spring.security.oauth2.client.registration.johndeere.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.johndeere.scope=openid, profile, offline_access, ag1, eq1, eq2, org1, org2, files
spring.security.oauth2.client.registration.johndeere.redirect-uri={baseUrl}/api/maquinaria/john-deere/auth/callback
spring.security.oauth2.client.provider.johndeere.authorization-uri=https://signin.johndeere.com/oauth2/aus78tnlaysMraFhC1t7/v1/authorize
spring.security.oauth2.client.provider.johndeere.token-uri=https://signin.johndeere.com/oauth2/aus78tnlaysMraFhC1t7/v1/token
spring.security.oauth2.client.provider.johndeere.jwk-set-uri=https://signin.johndeere.com/oauth2/aus78tnlaysMraFhC1t7/v1/keys
spring.security.oauth2.client.provider.johndeere.user-name-attribute=sub

john-deere.client-id=dummy
john-deere.client-secret=dummy
john-deere.api-base-url=https://sandboxapi.deere.com/platform

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dummy
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mercado Pago
mercadopago.access-token=dummy
mercadopago.success-url=http://localhost:3000/subscriptions?mp_status=approved
mercadopago.pending-url=http://localhost:3000/subscriptions?mp_status=pending
mercadopago.failure-url=http://localhost:3000/subscriptions?mp_status=failure
mercadopago.webhook-url=
mercadopago.currency-id=ARS
mercadopago.test-payer-email=
mercadopago.webhook-secret=
mercadopago.webhook-signature-required=true
mercadopago.webhook-replay-window-seconds=300

public.mercadopago.checkout.rate-limit-per-minute=15
public.auth.registro.rate-limit-per-minute=20

encryption.secret-key=
trusted.proxy.ips=

john-deere.redirect-uri=http://localhost:8080/api/maquinaria/john-deere/auth/callback
john-deere.frontend-redirect=http://localhost:3000/dashboard/maquinaria
