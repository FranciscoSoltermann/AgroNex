services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agronex-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    environment:
      - REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
    networks:
      - agronex-net
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine
    container_name: agronex-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - agronex-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: agronex-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - agronex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agronex-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    networks:
      - agronex-net
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agronex-prometheus
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - agronex-net

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: agronex-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - agronex-net
    depends_on:
      - prometheus

networks:
  agronex-net:
    driver: bridge
