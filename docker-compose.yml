services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agronex-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    environment:
      - REDIS_HOST=redis
    networks:
      - agronex-net
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: agronex-redis
    ports:
      - "6379:6379"
    networks:
      - agronex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agronex-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    networks:
      - agronex-net
    depends_on:
      - backend

networks:
  agronex-net:
    driver: bridge